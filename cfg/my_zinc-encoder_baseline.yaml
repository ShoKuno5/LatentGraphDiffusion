# Baseline ZINC encoder (10-layer) with shortened schedule
# Derived from the original zinc-encoder.yaml but capped at 50 epochs for HPC budget

out_dir: results/zinc-encoder-baseline
metric_best: mae
metric_agg: argmin
tensorboard_each_run: False
accelerator: "cuda:0"

mlflow:
  use: False
  project: Exp
  name: zinc-GRIT-RRWP

wandb:
  use: False
  project: ZINC

dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
  add_virtual_node_edge: True
  subgraph: False

train:
  mode: pretrain_encoder
  batch_size: 64
  eval_period: 1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  ckpt_period: 20
  ensemble_repeat: 1
  ensemble_mode: none
  pretrain:
    mask_node_prob: 0.0
    mask_edge_prob: 0.0
    mask_label_prob: 0.5
    recon: none
    original_task: True
    input_target: True
    node_factor: 0.0
    edge_factor: 0.0
    graph_factor: 1.0

model:
  type: GraphTransformerEncoder
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add

encoder:
  in_dim: 36
  prefix_dim: 64
  posenc_in_dim: 20
  posenc_in_dim_edge: 20
  posenc_dim: 28
  pe_raw_norm: None
  hid_dim: 64
  out_dim: 4
  use_time: False
  temb_dim: 0
  num_heads: 4
  num_layers: 10
  dropout: 0.0
  attn_dropout: 0.5
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    deg_scaler: False
    attn_product: mul
    attn_reweight: True
    edge_reweight: True
  mpnn:
    enable: True
    act: 'relu'
    dropout: 0.0
    edge_enhance: True
    project_edge: True
  residual: True
  layer_norm: False
  batch_norm: True
  act: 'relu'
  norm_e: True
  O_e: True
  ff_e: False
  update_e: True
  pool: add
  pool_edge: True
  post_pool: True
  pool_vn: False
  prefix_type: add_virtual
  label_embed_type: add_virtual
  num_task: 1
  task_type: regression
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False

gt:
  layer_type: GritTransformer
  layers: 10
  n_heads: 8
  dim_hidden: 64
  dropout: 0.0
  layer_norm: False
  batch_norm: True
  update_e: True
  attn_dropout: 0.2
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False

gnn:
  head: san_graph
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False

posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm

posenc_RRWP:
  enable: True
  ksteps: 20

optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 1e-3
  max_epoch: 50
  num_warmup_epochs: 10
  scheduler: cosine_with_warmup
  min_lr: 1e-6
