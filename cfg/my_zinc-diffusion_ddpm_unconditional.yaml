# Unconditional ZINC Diffusion Config - Fixed for Inference
# Based on zinc-diffusion_ddpm_baseline.yaml with unconditional generation

out_dir: results/zinc-ddpm-unconditional
metric_best: mae
metric_agg: argmin
tensorboard_each_run: False
accelerator: "cuda:0"

mlflow:
  use: False
  project: Exp
  name: zinc-GRIT-RRWP

wandb:
  use: True
  project: LGFM-ZINC-Diffusion-Unconditional
  entity: shokuno-the-university-of-tokyo
  name: ""    # Auto-generated

dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  num_tasks: 1
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
  add_virtual_node_edge: True
  subgraph: False

train:
  mode: train_diffusion
  batch_size: 256
  eval_period: 50
  start_eval_epoch: -1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  ckpt_period: 1  # Save checkpoint every epoch for testing
  ensemble_repeat: 1
  ensemble_mode: none
  early_stop: True
  early_stop_patience: 50
  pretrain:
    mask_node_prob: 0.0
    mask_edge_prob: 0.0
    mask_label_prob: 0.5
    recon: none
    original_task: True
    input_target: True
    node_factor: 0.0
    edge_factor: 0.0
    graph_factor: 1.0

model:
  type: LatentDiffusion
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add

posenc_RRWP:
  enable: True
  ksteps: 20

encoder:
  type: GraphTransformerEncoder
  in_dim: 36
  prefix_dim: 64
  posenc_in_dim: 20
  posenc_in_dim_edge: 20
  posenc_dim: 28
  pe_raw_norm: None
  hid_dim: 64
  out_dim: 4
  use_time: False
  temb_dim: 0
  num_heads: 4
  num_layers: 6
  dropout: 0.0
  attn_dropout: 0.5
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    deg_scaler: False
    attn_product: mul
    attn_reweight: True
    edge_reweight: True
  mpnn:
    enable: True
    act: 'relu'
    dropout: 0.0
    edge_enhance: True
    project_edge: True
  residual: True
  layer_norm: False
  batch_norm: True
  act: 'relu'
  norm_e: True
  O_e: True
  ff_e: False
  update_e: True
  pool: add
  pool_edge: True
  pool_vn: False
  post_pool: True
  prefix_type: add_virtual
  label_embed_type: add_virtual
  num_task: 1
  task_type: regression
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False

dt:
  in_dim: 4
  hid_dim: 64
  out_dim: 4
  use_time: True
  temb_dim: 64
  cond_dim: 4
  num_heads: 8
  num_layers: 6
  self_attn: True
  dropout: 0.05
  attn_dropout: 0.25
  residual: True
  layer_norm: True
  batch_norm: False
  act: 'relu'
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    deg_scaler: False
    attn_product: mul
    attn_reweight: False
    edge_reweight: False
  norm_e: True
  O_e: True
  ff_e: False
  ff_e_ca: True
  ff_e_sa: False
  pool: add
  pool_edge: True
  pool_vn: False
  post_pool: True
  condition_list: ['unconditional']  # KEY CHANGE: unconditional instead of masked_graph

diffusion:
  timesteps: 1000
  conditioning_key: crossattn
  hid_dim: 4
  cond_stage_key: unconditional
  first_stage_config: runs/encoder_retrain_zinc_encoder_20250917_152946/my_zinc-encoder-fast_retrain/0/ckpt/99.ckpt
  cond_stage_config: __is_unconditional__
  node_factor: 1.0
  edge_factor: 1.0
  graph_factor: 1.0
  task_factor: 1.0

gt:
  layer_type: GritTransformer
  layers: 6  # Matches encoder depth
  n_heads: 4  # Matches encoder head count
  dim_hidden: 64
  dropout: 0.0
  layer_norm: False
  batch_norm: True
  update_e: True
  attn_dropout: 0.2
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False

gnn:
  head: san_graph
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False

optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 0.01        # aligned with flow
  base_lr: 1.0e-4           # aligned with flow
  max_epoch: 50             # align training budget
  num_warmup_epochs: 0      # aligned with flow
  scheduler: cosine_with_warmup
  min_lr: 1e-6
