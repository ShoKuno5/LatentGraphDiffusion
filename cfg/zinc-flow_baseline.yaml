# Conditional Latent Flow Matching baseline for ZINC (masked graph)

out_dir: results/zinc-flow-baseline
metric_best: mae
metric_agg: argmin
tensorboard_each_run: False
accelerator: "cuda:0"
seed: 0
trainer:
  precision: 16-mixed

mlflow:
  use: False
  project: Exp
  name: zinc-flow-baseline

wandb:
  use: True
  project: LGFM-ZINC-Flow
  entity: shokuno-the-university-of-tokyo
  name: ""

dataset:
  format: PyG-ZINC
  name: subset
  task: graph
  num_tasks: 1
  task_type: regression
  transductive: False
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False
  add_virtual_node_edge: True
  subgraph: False

train:
  mode: train_diffusion
  batch_size: 256
  eval_period: 10
  start_eval_epoch: -1
  enable_ckpt: True
  ckpt_best: True
  ckpt_clean: True
  ckpt_period: 50
  ensemble_repeat: 1
  ensemble_mode: none
  early_stop: False
  pretrain:
    mask_node_prob: 0.0
    mask_edge_prob: 0.0
    mask_label_prob: 0.5
    recon: none
    original_task: True
    input_target: True
    node_factor: 0.0
    edge_factor: 0.0
    graph_factor: 1.0

train_flow:
  ema: True
  grad_clip: 1.0
  batch_accumulation: 1

model:
  type: LatentFlow
  loss_fun: l1
  edge_decoding: dot
  graph_pooling: add

posenc_RRWP:
  enable: True
  ksteps: 20

encoder:
  type: GraphTransformerEncoder
  in_dim: 36
  prefix_dim: 64
  posenc_in_dim: 20
  posenc_in_dim_edge: 20
  posenc_dim: 28
  pe_raw_norm: None
  hid_dim: 64
  out_dim: 4
  use_time: False
  temb_dim: 0
  num_heads: 4
  num_layers: 10
  dropout: 0.0
  attn_dropout: 0.5
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    deg_scaler: False
    attn_product: mul
    attn_reweight: True
    edge_reweight: True
  mpnn:
    enable: True
    act: 'relu'
    dropout: 0.0
    edge_enhance: True
    project_edge: True
  residual: True
  layer_norm: False
  batch_norm: True
  act: 'relu'
  norm_e: True
  O_e: True
  ff_e: False
  update_e: True
  pool: add
  pool_edge: True
  post_pool: True
  pool_vn: False
  prefix_type: add_virtual
  label_embed_type: add_virtual
  num_task: 1
  task_type: regression
  node_encoder: True
  node_encoder_name: TypeDictNode
  node_encoder_num_types: 21
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: TypeDictEdge
  edge_encoder_num_types: 4
  edge_encoder_bn: False

diffusion:
  conditioning_key: crossattn
  node_factor: 1.0
  edge_factor: 1.0
  graph_factor: 1.0
  task_factor: 1.0

dt:
  in_node_dim: 4
  in_edge_dim: 4
  in_dim: 4
  hid_dim: 64
  out_dim: 4
  use_time: True
  temb_dim: 64
  cond_dim: 4
  num_heads: 8
  num_layers: 4
  self_attn: True
  dropout: 0.05
  attn_dropout: 0.25
  residual: True
  layer_norm: True
  batch_norm: False
  act: 'relu'
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False
    signed_sqrt: True
    score_act: True
    deg_scaler: False
    attn_product: mul
    attn_reweight: False
    edge_reweight: False
  norm_e: True
  O_e: True
  ff_e: False
  ff_e_ca: True
  ff_e_sa: False
  pool: add
  pool_edge: True
  pool_vn: False
  post_pool: True
  condition_list: ['masked_graph']

flow:
  conditioning_key: crossattn
  hid_dim: 4
  cond_stage_key: masked_graph
  first_stage_config: runs/zinc_encoder_20250930_004610/my_zinc-encoder_baseline/0/ckpt/399.ckpt
  cond_stage_config: __is_first_stage__
  first_stage_trainable: False
  cond_stage_trainable: False
  objective: rectified
  solver: heun
  nfe: 50
  t_weight: none
  node_factor: 1.0
  edge_factor: 1.0
  graph_factor: 1.0
  task_factor: 1.0
  use_graph_latent: True
  force_undirected: False
  ema: True
  alpha_fn: linear
  sigma_fn: constant
  sigma_min: 0.01
  sigma_max: 1.0
  task_decode:
    method: ode  # options: teacher, velocity_step, ode
    method_train: ode
    method_eval: ode
    ode_steps: 2
    ode_steps_train: 2
    ode_steps_eval: 16
    ode_method: euler
    ode_method_train: euler
    ode_method_eval: heun

gt:
  layer_type: GritTransformer
  layers: 10
  n_heads: 8
  dim_hidden: 64
  dropout: 0.0
  layer_norm: False
  batch_norm: True
  update_e: True
  attn_dropout: 0.2
  attn:
    clamp: 5.
    act: 'relu'
    full_attn: True
    edge_enhance: True
    O_e: True
    norm_e: True
    fwl: False

gnn:
  head: san_graph
  layers_pre_mp: 0
  layers_post_mp: 3
  dim_inner: 64
  batchnorm: True
  act: relu
  dropout: 0.0
  agg: mean
  normalize_adj: False

optim:
  clip_grad_norm: True
  optimizer: adamW
  weight_decay: 1e-5
  base_lr: 1e-4
  max_epoch: 2000
  num_warmup_epochs: 50
  scheduler: cosine_with_warmup
  min_lr: 1e-6
